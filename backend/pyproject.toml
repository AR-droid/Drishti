[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "drishti-backend"
version = "0.1.0"
description = "Local, synthetic-data backend foundation for Drishti"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"

[tool.setuptools]
packages = ["app", "app.agent", "app.models", "app.security", "app.storage", "app.tools"]
